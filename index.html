<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gulf Coast Farm: farms, markets and seafood in Mobile and Baldwin County</title>
<meta name="description" content="Find local farms, farmers markets, u-pick fields, honey, beef, eggs, and Gulf seafood in Mobile and Baldwin County, Alabama. Free, community maintained.">
<link rel="canonical" href="https://gulfcoastfarm.com/">
<meta property="og:title" content="Gulf Coast Farm: Mobile and Baldwin County">
<meta property="og:description" content="Every local farm, market, and seafood dock we can find, on one map.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14603e">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/style.css?v=122970e5">
</head>
<body>
<!--
  THESIS: A map of local food where the map is the page. Listings float over it
  and are ranked by whether you can actually go. It refuses the split-screen
  half-map-half-cards directory the category always ships.
  OWN-WORLD: Highway guide green sign band over a desaturated map; condensed
  Big Shoulders caps for wayfinding only, Public Sans for everything read;
  colour carries the listing type and shape carries it again; enamel red means
  one thing only, ready this month.
  STORY: The visitor sees what is in season, scans places over the map they
  will drive, and leaves with a name, its hours and directions.
  FIRST VIEWPORT: Slim green band, map edge to edge, floating panel at left
  holding the month, search, filters and the first cards.
  FORM: Roadside signage pulled toward the category standard, map-first, user
  pinned over the concept roll. Seed b5f9ee06.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, and DESIGN.md
-->
<div class="shell">

  <header class="band">
    <div class="inner">
      <h1 class="wordmark"><a href="./">Gulf Coast Farm<span class="co">Mobile &amp; Baldwin County, Alabama</span></a></h1>
      <a class="add" href="submit.html">Add a listing &rarr;</a>
    </div>
  </header>

  <div class="stage">
    <div id="map" role="region" aria-label="Map of local farms, markets and seafood docks"></div>

    <div class="legend" aria-hidden="true">
      <span><i class="farm"></i>Farm</span>
      <span><i class="market"></i>Farmers market</span>
      <span><i class="seafood"></i>Seafood dock</span>
      <span><i class="store"></i>Farm store</span>
      <span><i class="rdy"></i>Ready this month</span>
    </div>

    <section class="panel" id="panel" aria-label="Places">
      <button class="grab" id="grab" aria-label="Resize the list"></button>
      <div class="phead">
        <div class="season">
          <h2 class="month" id="seasonMonth">&nbsp;</h2>
          <p class="lede" id="seasonLede">Free and community built.</p>
        </div>
        <div class="plates" id="seasonPlates"></div>
        <div class="searchrow">
          <div class="search">
            <label class="vh" for="q">Search farms, markets and products</label>
            <input id="q" type="search" placeholder="Honey, satsumas, Foley, beef" autocomplete="off">
            <button class="clear" id="clearQ" type="button" aria-label="Clear search">&times;</button>
          </div>
          <button class="near" id="nearBtn" type="button" aria-pressed="false">Near me</button>
        </div>
        <div class="plates" id="filters"></div>
        <div class="plates" id="catFilters"></div>
      </div>
      <div class="count" id="count" aria-live="polite">Loading</div>
      <div class="plist" id="plist">
        <div class="skel"><div></div><div></div><div></div><div></div></div>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js?v=122970e5"></script>
</body>
</html>
